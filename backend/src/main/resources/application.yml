spring:
  application:
    name: singpay-demo

  datasource:
    url: jdbc:mysql://localhost:3306/singpay_demo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # traite le schéma existant (table orders) comme baseline
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: update        # En prod : utiliser 'validate' + Flyway/Liquibase
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

# ── Variables SingPay ─────────────────────────────────────────────────────────
singpay:
  base-url: https://gateway.singpay.ga/v1
  client-id: ${SINGPAY_CLIENT_ID:demo-client-id}
  client-secret: ${SINGPAY_CLIENT_SECRET:demo-client-secret}
  wallet-id: ${SINGPAY_WALLET_ID:demo-wallet-id}
  disbursement-id: ${SINGPAY_DISBURSEMENT_ID:}
  webhook-secret: ${SINGPAY_WEBHOOK_SECRET:}

# ── URL de base de ton application (pour les redirects SingPay) ──────────────
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  api-key: ${APP_API_KEY:dev-key-change-in-production}

  # ── JWT ────────────────────────────────────────────────────────────────────
  # JWT_SECRET : générer via `openssl rand -base64 32` (256 bits minimum)
  # La valeur par défaut ci-dessous est UNIQUEMENT pour le dev local — JAMAIS en prod
  jwt:
    secret: ${JWT_SECRET:c2luZ3BheURlbW9EZXZTZWNyZXRLZXlOZXZlclVzZUluUHJvZHVjdGlvbk9ubHlGb3JMb2NhbERldjI=}
    expiry-ms: ${JWT_EXPIRY_MS:900000}           # access token : 15 minutes
    refresh-expiry-days: ${JWT_REFRESH_DAYS:7}   # refresh token : 7 jours
    cookie-secure: ${JWT_COOKIE_SECURE:false}     # true en prod (HTTPS uniquement)

  # ── Proxy de confiance (rate limiter) ─────────────────────────────────────
  # IPs des reverse proxies de confiance (Nginx, Cloudflare) — vide = désactivé
  trusted-proxy-ips: ${TRUSTED_PROXY_IPS:}

  # ── Webhook SingPay (HMAC) ─────────────────────────────────────────────────
  singpay-webhook-hmac-secret: ${SINGPAY_WEBHOOK_HMAC_SECRET:}

# ── Stripe ────────────────────────────────────────────────────────────────────
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    "[com.demo.singpay]": DEBUG
    "[org.springframework.web.client]": DEBUG

---
# Profil production
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    "[com.demo.singpay]": INFO
    "[org.springframework.web.client]": WARN
