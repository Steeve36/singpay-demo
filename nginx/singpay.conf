# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Configuration SingPay Demo
# Remplacer TON_DOMAINE.COM par ton vrai domaine partout dans ce fichier
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name TON_DOMAINE.COM www.TON_DOMAINE.COM;

    # Let's Encrypt challenge (Certbot en a besoin)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl;
    server_name TON_DOMAINE.COM www.TON_DOMAINE.COM;

    # ── Certificats Let's Encrypt (générés par Certbot) ───────────────────────
    ssl_certificate     /etc/letsencrypt/live/TON_DOMAINE.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TON_DOMAINE.COM/privkey.pem;

    # ── Paramètres TLS sécurisés ──────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Headers de sécurité ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Taille max des requêtes (webhooks Stripe peuvent être volumineux) ──────
    client_max_body_size 2m;

    # ── API Spring Boot (port 8080) ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — laisser de la marge pour les appels SingPay/Stripe
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Webhooks Spring Boot ──────────────────────────────────────────────────
    location /webhook/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Frontend Angular (fichiers statiques buildés) ─────────────────────────
    # Après `ng build`, copier dist/frontend/ dans /var/www/singpay/
    root /var/www/singpay;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # Angular routing SPA
    }

    # Cache les assets buildés (hash dans le nom de fichier)
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
