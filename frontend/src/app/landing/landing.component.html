<div class="landing-page">
  <div class="landing-card">

    <div class="landing-logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
        <line x1="6" y1="15" x2="9" y2="15"/>
        <line x1="11" y1="15" x2="14" y2="15"/>
      </svg>
      <span class="landing-brand">SingPay</span>
    </div>

    <h1 class="landing-title">Landing page</h1>
    <p class="landing-subtitle">
      Bienvenue sur la plateforme de paiement SingPay.<br>
      Connectez-vous pour accéder à votre espace.
    </p>

    <a
      class="btn-primary"
      [routerLink]="['/login']"
      [queryParams]="{ returnUrl: '/' }"
    >
      Se connecter
    </a>

    <p class="landing-footer">
      Pas encore de compte ?
      <a routerLink="/register">Créer un compte</a>
    </p>

  </div>
</div>
