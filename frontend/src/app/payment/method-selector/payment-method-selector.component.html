<div class="method-selector">
  <p class="selector-title">Choisissez votre mode de paiement</p>

  <div class="methods-grid" role="radiogroup" aria-label="Mode de paiement">

    <button
      *ngFor="let m of methods; trackBy: trackById"
      type="button"
      class="method-card"
      [class.method-card--selected]="selected === m.id"
      [class.method-card--disabled]="!m.available"
      [attr.aria-checked]="selected === m.id"
      [attr.aria-label]="m.ariaLabel"
      [attr.aria-disabled]="!m.available"
      [disabled]="!m.available"
      (click)="select(m)"
      role="radio"
    >
      <!-- Icône -->
      <span class="method-icon" aria-hidden="true">
        <!-- Mobile Money -->
        <svg *ngIf="m.id === 'mobile-money'" width="24" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
          <rect x="5" y="2" width="14" height="20" rx="0"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        <!-- Card -->
        <svg *ngIf="m.id === 'card'" width="24" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
          <rect x="2" y="5" width="20" height="14" rx="0"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        <!-- Bank transfer -->
        <svg *ngIf="m.id === 'bank-transfer'" width="24" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
          <line x1="3" y1="22" x2="21" y2="22"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <polyline points="12 2 3 7 21 7"/>
          <line x1="6" y1="12" x2="6" y2="22"/>
          <line x1="12" y1="12" x2="12" y2="22"/>
          <line x1="18" y1="12" x2="18" y2="22"/>
        </svg>
      </span>

      <span class="method-info">
        <span class="method-label">{{ m.label }}</span>
        <span class="method-sublabel">{{ m.sublabel }}</span>
      </span>

      <span class="method-badge" *ngIf="!m.available" aria-hidden="true">Bientôt</span>

      <!-- Radio indicator -->
      <span class="method-radio" aria-hidden="true">
        <span class="method-radio__dot" *ngIf="selected === m.id"></span>
      </span>
    </button>

  </div>

  <button
    type="button"
    class="btn-confirm"
    [disabled]="!selected || loading"
    [class.btn-confirm--loading]="loading"
    (click)="confirm()"
    aria-label="Confirmer le mode de paiement sélectionné"
  >
    <span *ngIf="!loading">Continuer vers le paiement</span>
    <span *ngIf="loading" class="spinner-row">
      <span class="spinner" aria-hidden="true"></span>
      Redirection…
    </span>
  </button>
</div>
